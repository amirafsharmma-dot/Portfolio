    <title>Document</title>
    <style>
          * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #1a1a2e;
      }

      hr {
        display: none;
      }

      .container {
        background: #16213e;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        width: 300px;
        overflow: hidden;
        padding: 0;
      }

      .result-Box {
        display: block;
        width: 100%;
        background: #0f0f23;
        border: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 1.2rem 1rem 0.8rem;
        font-family: monospace;
        font-size: 2rem;
        font-weight: 500;
        color: #ffffff;
        text-align: right;
        outline: none;
      }

      .num-Box {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }

      .num-Box button {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        border-left: 1px solid rgba(255, 255, 255, 0.06);
        background: #16213e;
        color: #e0e0e0;
        font-size: 1rem;
        font-weight: 400;
        padding: 0;
        height: 64px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.12s ease;
      }

      .num-Box button:nth-child(4n + 1) {
        border-left: none;
      }

      .num-Box button:hover {
        background: #1e2d4a;
      }

      .num-Box button:active {
        transform: scale(0.95);
        background: #0f0f23;
      }

      /* دکمه‌های عملیاتی + - * / */
      .num-Box button:nth-child(4),
      .num-Box button:nth-child(8),
      .num-Box button:nth-child(12),
      .num-Box button:nth-child(16) {
        color: #60a5fa;
        background: rgba(96, 165, 250, 0.1);
        font-weight: 500;
      }

      /* C و BS */
      .num-Box button:nth-child(13),
      .num-Box button:nth-child(15) {
        color: #94a3b8;
        font-size: 0.85rem;
      }

      /* دکمه = */
      .num-Box button:nth-child(17) {
        grid-column: -1 / -5;
        border-left: none;
        background: #3b82f6;
        color: #ffffff;
        font-size: 1.1rem;
        font-weight: 500;
      }

      .num-Box button:nth-child(17):hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <div id="container" class="container">
      <input type="text" class="result-Box" id="result-Box" />
      <hr />
      <div id="num-Box" class="num-Box"></div>
    </div>
    
    <script>
      const input = document.querySelector("input");
      const buttons = document.getElementById("num-Box");

      let elem = [
        "1",
        "2",
        "3",
        "+",
        "4",
        "5",
        "6",
        "-",
        "7",
        "8",
        "9",
        "*",
        "C",
        "0",
        "BS",
        "/",
        "=",
      ];

      elem.forEach((element) => {
        const btn = document.createElement("button");
        btn.textContent = element;
        buttons.appendChild(btn);
      });

      buttons.addEventListener("click", function (e) {
        if (e.target.tagName === "BUTTON") {
          const value = e.target.textContent;
          const lastChar = input.value.slice(-1);

          if (
            value === "+" ||
            value === "-" ||
            value === "*" ||
            value === "/"
          ) {
            if (input.value === "") {
              if (value === "-") {
                input.value += value;
              }
              return;
            }

            if (
              lastChar === "+" ||
              lastChar === "-" ||
              lastChar === "*" ||
              lastChar === "/"
            ) {
              return;
            }
            input.value += value;
          } else if (value === "=") {
            try {
              const result = Function("return " + input.value)();
              input.value = result;
            } catch {
              input.value = "خطا";
            }
          } else if (value === "BS") {
            input.value = input.value.slice(0, -1);
          } else if (value === "C") {
            input.value = "";
          } else {
            input.value += value;
          }
        }
      });
