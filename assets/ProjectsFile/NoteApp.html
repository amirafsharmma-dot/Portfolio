<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoteApp</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      font-family:sans-serif;
      background:#f0f0f0;
    }

    input, button { border:none; background:none; cursor:pointer; }

    .container {
      background:#228b22;
      padding:1.2rem;
      border-radius:8px;
      width:90%;
      max-width:560px;
    }

    .head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:1rem;
    }

    .head h2 { color:#fff; font-size:1.1rem; }

    #valueNOTE {
      font-size:0.8rem;
      color:rgba(255,255,255,0.75);
    }

    .items {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:0.8rem;
    }

    #addbtntxt {
      color:#fff;
      background:rgba(255,255,255,0.2);
      padding:0.3rem 0.8rem;
      border-radius:4px;
      font-size:0.85rem;
      transition:background 0.2s;
    }
    #addbtntxt:hover { background:rgba(255,255,255,0.35); }

    .intbox { display:flex; gap:0.5rem; }
    .intbox button {
      color:#fff;
      font-size:0.8rem;
      padding:0.25rem 0.6rem;
      border:1px solid rgba(255,255,255,0.4);
      border-radius:4px;
      transition:background 0.2s;
    }
    .intbox button:hover { background:rgba(255,255,255,0.2); }

    #ustxt { margin-top:0.4rem; }

    .divbox {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0.4rem 0.6rem;
      margin:0.35rem 0;
      background:#f9f9f9;
      border:1px solid #e0e0e0;
      border-radius:4px;
      height:32px;
      overflow:hidden;
      flex-direction:row-reverse;
    }
    .divbox:nth-child(even) { background:#efefef; }

    .morebtn {
      color:#1a6fcc;
      font-size:0.8rem;
      cursor:pointer;
      white-space:nowrap;
    }
    .morebtn:hover { text-decoration:underline; }

    .boxtwo {
      position:relative;
      margin-top:0.8rem;
    }

    #inputText {
      width:100%;
      padding:0.5rem 5rem 0.5rem 0.6rem;
      border-radius:4px;
      outline:none;
      background:#fff;
      font-size:0.9rem;
      border:2px solid transparent;
      transition:border-color 0.2s;
    }
    #inputText:focus { border-color:#00ccff; }

    #submitBtn {
      background:#00ccff;
      padding:0.4rem 0.8rem;
      border-top-right-radius:4px;
      border-bottom-right-radius:4px;
      position:absolute;
      top:1px; right:1px; bottom:1px;
      font-size:0.85rem;
      font-weight:600;
      color:#fff;
      transition:background 0.2s;
    }
    #submitBtn:hover { background:#00aadd; }

    .errorh {
      border-color:red !important;
      background:rgb(255,235,235) !important;
    }

    .backi {
      display:flex;
      justify-content:flex-end;
      margin-bottom:0.4rem;
      cursor:pointer;
      color:rgba(255,255,255,0.8);
      font-size:0.85rem;
    }
    .backi:hover { color:#fff; }

    .divend {
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-direction:row-reverse;
      padding:0.5rem 0.6rem;
      background:#fff;
      border-radius:4px;
      margin-top:0.3rem;
    }
    .divend button {
      color:#e53935;
      font-weight:700;
      font-size:1rem;
      padding:0 0.4rem;
    }
    .divend button:hover { color:#b71c1c; }

    .flexBox { display:flex; flex-direction:column; }
    .gridBox { display:grid; grid-template-columns:repeat(2,1fr); gap:0.4rem; }

    @media(max-width:468px) {
      #inputText { padding:.5rem 4.5rem .5rem .5rem; }
    }
  </style>
</head>
<body>

<section class="container">
  <div class="boxone" id="boxone">
    <div class="head">
      <h2>Welcome NoteApps</h2>
      <span id="valueNOTE"></span>
    </div>
    <div class="items">
      <input type="button" id="addbtntxt" value="Add Your Notes" />
      <div class="intbox" id="intbox"></div>
    </div>
    <div id="ustxt"></div>
  </div>

  <div class="boxtwo" id="boxtwo">
    <input type="text" id="inputText" placeholder="Add your text..." />
    <input type="submit" id="submitBtn" value="Add" />
  </div>

  <div id="boxthree"></div>
</section>

<script>
  const BoxOne     = document.getElementById('boxone');
  const BoxTwo     = document.getElementById('boxtwo');
  const ustxt      = document.getElementById('ustxt');
  const AddBtnText = document.getElementById('addbtntxt');
  const SubmitBtn  = document.getElementById('submitBtn');
  const inputText  = document.getElementById('inputText');
  const BoxThree   = document.getElementById('boxthree');
  const inputbox   = document.getElementById('intbox');
  const NoteValue  = document.getElementById('valueNOTE');

  BoxTwo.style.display   = 'none';
  BoxThree.style.display = 'none';

  function usertxt() {
    AddBtnText.addEventListener('click', () => {
      BoxOne.style.display = 'none';
      BoxTwo.style.display = 'block';
      inputText.focus();
    });

    SubmitBtn.addEventListener('click', () => {
      const inputValue = inputText.value.trim();
      if (inputValue !== '') {
        inputText.classList.remove('errorh');

        const div = document.createElement('div');
        div.classList.add('divbox');

        const span = document.createElement('span');
        span.textContent = inputValue;

        const morebtn = document.createElement('button');
        morebtn.textContent = 'More...';
        morebtn.classList.add('morebtn');

        morebtn.addEventListener('click', () => {
          BoxThree.innerHTML = '';

          const back = document.createElement('span');
          back.textContent = '← back';
          back.classList.add('backi');
          back.addEventListener('click', () => {
            BoxOne.style.display   = 'block';
            BoxThree.style.display = 'none';
            BoxThree.innerHTML     = '';
            box();
            updatenotevalue();
          });

          const divbt = document.createElement('div');
          divbt.classList.add('divend');

          const removebtn = document.createElement('button');
          removebtn.textContent = '✕';
          const more = document.createElement('span');
          more.textContent = span.textContent;

          divbt.appendChild(removebtn);
          divbt.appendChild(more);
          BoxThree.appendChild(back);
          BoxThree.appendChild(divbt);

          BoxOne.style.display   = 'none';
          BoxThree.style.display = 'block';

          removebtn.addEventListener('click', () => {
            BoxOne.style.display   = 'block';
            BoxThree.style.display = 'none';
            ustxt.removeChild(div);
            BoxThree.innerHTML = '';
            box();
            updatenotevalue();
          });
        });

        div.appendChild(morebtn);
        div.appendChild(span);
        ustxt.appendChild(div);

        box();
        updatenotevalue();

        BoxOne.style.display = 'block';
        BoxTwo.style.display = 'none';
        inputText.value      = '';
      } else {
        inputText.classList.add('errorh');
      }
    });
  }
  usertxt();

  function box() {
    if (ustxt.textContent.trim() !== '') {
      inputbox.innerHTML = '';
      const intOne = document.createElement('button');
      const intTwo = document.createElement('button');
      intOne.textContent = 'Flex';
      intTwo.textContent = 'Grid';
      intOne.addEventListener('click', () => {
        ustxt.classList.add('flexBox');
        ustxt.classList.remove('gridBox');
      });
      intTwo.addEventListener('click', () => {
        ustxt.classList.add('gridBox');
        ustxt.classList.remove('flexBox');
      });
      inputbox.appendChild(intOne);
      inputbox.appendChild(intTwo);
    } else {
      inputbox.innerHTML = '';
    }
  }

  function updatenotevalue() {
    const value = ustxt.querySelectorAll('div').length;
    NoteValue.textContent = value === 0 ? '' : `نوت: ${value}`;
  }

  inputText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') SubmitBtn.click();
  });
</script>
</body>
</html>
