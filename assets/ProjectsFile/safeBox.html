<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        /* رنگ‌های اصلی تم */
        --bg: #05070b;
        --bg-color: #0b0e14;
        --metal-dark: #11151c;
        --metal-light: #4c5664;
        /* پس‌زمینه اصلی */
        --card-bg: #151921;
        /* پس‌زمینه کارت‌ها/بخش‌ها */

        /* رنگ بنفش جدید */
        --accent-color: #00d4ff;
        /* رنگ بنفش درخشان (جایگزین آبی قبلی) */

        /* رنگ‌های متن */
        --text-main: #e1e6ed;
        /* متن اصلی */
        --text-muted: #94a3b8;
        /* متن‌های فرعی */

        /* سایه‌ها و بوردرها */
        --card-border: 2px solid #3e423a;
        --shadow-glow: 0 4px 20px rgba(0, 0, 0, 0.3);
        --shadow-glow2: 3px 3px 10px rgba(0, 179, 188, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: var(--bg);
        background: radial-gradient(circle, #18202b, var(--bg));
      }

      .safe {
        perspective: 1000px;
        position: relative;
        width: 400px;
        height: 250px;

        outline: 8px solid var(--metal-light);
        border-radius: 0.5rem;
      }

      .inside {
        height: 100%;
      }

      .inside img {
        width: 100%;
        height: 100%;

        border-radius: 0.5rem;
      }
      .door {
        width: 100%;
        height: 100%;
        background-color: var(--bg-color);

        border-radius: 0.5rem;

        transform-origin: left center;
        transition: transform 1.2s ease;

        transform-style: preserve-3d;

        position: absolute;

        display: flex;
      }

      .opendoor {
        animation: identifier 7s ease 4s;
      }

      @keyframes identifier {
        0% {
          transform: rotateY(0);
        }

        50% {
          transform: rotateY(-70deg);
        }

        70% {
          transform: rotateY(-70deg);
        }

        100% {
          transform: rotateY(0);
        }
      }

      .left {
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
      }

      .lolo {
        display: flex;
        flex-direction: column;
        gap: 4rem;
        position: absolute;

        left: -5px;
        top: 50%;
        transform: translateY(-50%);
      }

      .lole {
        width: 8px;
        height: 15px;
        background-color: rgb(135, 130, 130);
        border-radius: 0.2rem;
      }

      #password {
        outline: none;
        border: none;
        border-bottom: 1px solid lightgray;
        margin: 1rem 0;
        padding: 0.3rem 0;
        background: none;
        color: #fff;

        letter-spacing: 8px;
      }

      .int--container {
        position: relative;
        display: inline-block;
      }

      .int--container::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 16px;
        width: 0;
        height: 1px;

        z-index: 20;
        transition: width 0.4s linear;
      }

      .int--container:focus-within::after {
        width: 100%;
      }

      label {
        color: #fff;
      }

      .charkh {
        border-radius: 0.5rem;
        background: none;
        border: 1px solid var(--accent-color);
        color: #fff;
        display: flex;
        position: relative;
      }

      .container {
        display: flex;

        transform: translateX(15px);
      }

      #btnUn {
        margin: 1rem 0 0;
        border: 1px solid var(--accent-color);
        padding: 0.6rem 0.2rem;
        border-radius: 0.5rem;
        background: none;
        color: #fff;
      }

      .right {
        display: flex;
        align-items: center;

        border-top-right-radius: 0.5rem;
        border-bottom-right-radius: 0.5rem;
        background-color: lightblue;

        position: relative;
      }

      .span {
        background-color: rgb(92, 90, 90);

        width: 30px;
        height: 15px;
        border-radius: 0.5rem;
      }

      .container--span {
        display: flex;
        flex-direction: column;
        gap: 5rem;

        position: absolute;
        right: -8px;
      }

      .spanG {
        width: 30px;
        height: 15px;
        border-radius: 0.5rem;

        background-color: var(--card-bg);

        position: absolute;
      }

      .oneG {
        animation: openG 10.5s linear;
      }
      .twoG {
        animation: openG 10.5s linear 1.5s;
      }
      .threeG {
        animation: openG 10.5s linear 3s;
      }

      @keyframes openG {
        0%,
        100% {
          right: 0;
        }
        25% {
          right: 20px;
        }

        50% {
          right: 20px;
        }

        75% {
          right: 20px;
        }
      }

      .right img {
        width: 100%;
      }

      .animaImg {
        animation: anima 3s forwards;
      }
      @keyframes anima {
        from {
          transform: rotate(0);
        }

        to {
          transform: rotate(360deg);
        }
      }

      .svgTwo {
        position: absolute;
        left: 40px;
        transform: rotate(-20deg);
      }
      .svgThree {
        position: absolute;
        left: 80px;
        transform: rotate(-2deg);
      }

      @keyframes gear1 {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(90deg);
        }
      }

      @keyframes gear2 {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(-90deg);
        }
      }

      svg {
        transform-origin: center;
      }

      img {
        
    transform-origin:center center;
}

      

      .rotate1 {
        animation: gear1 1s linear;
      }
      .rotate2 {
        animation: gear2 1s linear;
      }

      .opp {
        animation: error 1s ease;
      }

      @keyframes error {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.05);
        }

        100% {
          transform: scale(1);
        }
      }

      .move {
        animation: vibration 3s linear;
      }

      @keyframes vibration {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translate(2px, 2px);
        }
        50% {
          transform: translate(-4px, -4px);
        }
        75% {
          transform: translate(2px, 2px);
        }
      }
    </style>
  </head>
  <body>
    <div class="safe">
      <div class="door">
        <!-- دستگیره و قفل -->
        <div class="left">
          <div class="lolo">
            <span class="lole"></span>
            <span class="lole"></span>
            <span class="lole"></span>
          </div>
          <label for="password">Vault Code</label>
          <div class="int--container">
            <input type="text" id="password" placeholder="****" maxlength="4" />
          </div>

          <div class="charkh">
            <div class="container">
              <div class="svg svgOne">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="50"
                  height="50"
                  viewBox="0 0 24 24"
                  fill="currentColor">
                  <path
                    d="M10.42 3.85 L10.02 1.79 A10.40 10.40 0 0 1 13.98 1.79 L13.58 3.85 A8.30 8.30 0 0 1 16.64 5.12 L17.82 3.38 A10.40 10.40 0 0 1 20.62 6.18 L18.88 7.36 A8.30 8.30 0 0 1 20.15 10.42 L22.21 10.02 A10.40 10.40 0 0 1 22.21 13.98 L20.15 13.58 A8.30 8.30 0 0 1 18.88 16.64 L20.62 17.82 A10.40 10.40 0 0 1 17.82 20.62 L16.64 18.88 A8.30 8.30 0 0 1 13.58 20.15 L13.98 22.21 A10.40 10.40 0 0 1 10.02 22.21 L10.42 20.15 A8.30 8.30 0 0 1 7.36 18.88 L6.18 20.62 A10.40 10.40 0 0 1 3.38 17.82 L5.12 16.64 A8.30 8.30 0 0 1 3.85 13.58 L1.79 13.98 A10.40 10.40 0 0 1 1.79 10.02 L3.85 10.42 A8.30 8.30 0 0 1 5.12 7.36 L3.38 6.18 A10.40 10.40 0 0 1 6.18 3.38 L7.36 5.12 A8.30 8.30 0 0 1 10.42 3.85 Z
    M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" />
                </svg>
              </div>

              <div class="svg svgTwo">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="50"
                  height="50"
                  viewBox="0 0 24 24"
                  fill="currentColor">
                  <path
                    d="M10.42 3.85 L10.02 1.79 A10.40 10.40 0 0 1 13.98 1.79 L13.58 3.85 A8.30 8.30 0 0 1 16.64 5.12 L17.82 3.38 A10.40 10.40 0 0 1 20.62 6.18 L18.88 7.36 A8.30 8.30 0 0 1 20.15 10.42 L22.21 10.02 A10.40 10.40 0 0 1 22.21 13.98 L20.15 13.58 A8.30 8.30 0 0 1 18.88 16.64 L20.62 17.82 A10.40 10.40 0 0 1 17.82 20.62 L16.64 18.88 A8.30 8.30 0 0 1 13.58 20.15 L13.98 22.21 A10.40 10.40 0 0 1 10.02 22.21 L10.42 20.15 A8.30 8.30 0 0 1 7.36 18.88 L6.18 20.62 A10.40 10.40 0 0 1 3.38 17.82 L5.12 16.64 A8.30 8.30 0 0 1 3.85 13.58 L1.79 13.98 A10.40 10.40 0 0 1 1.79 10.02 L3.85 10.42 A8.30 8.30 0 0 1 5.12 7.36 L3.38 6.18 A10.40 10.40 0 0 1 6.18 3.38 L7.36 5.12 A8.30 8.30 0 0 1 10.42 3.85 Z
    M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" />
                </svg>
              </div>

              <div class="svg svgThree">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="50"
                  height="50"
                  viewBox="0 0 24 24"
                  fill="currentColor">
                  <path
                    d="M10.42 3.85 L10.02 1.79 A10.40 10.40 0 0 1 13.98 1.79 L13.58 3.85 A8.30 8.30 0 0 1 16.64 5.12 L17.82 3.38 A10.40 10.40 0 0 1 20.62 6.18 L18.88 7.36 A8.30 8.30 0 0 1 20.15 10.42 L22.21 10.02 A10.40 10.40 0 0 1 22.21 13.98 L20.15 13.58 A8.30 8.30 0 0 1 18.88 16.64 L20.62 17.82 A10.40 10.40 0 0 1 17.82 20.62 L16.64 18.88 A8.30 8.30 0 0 1 13.58 20.15 L13.98 22.21 A10.40 10.40 0 0 1 10.02 22.21 L10.42 20.15 A8.30 8.30 0 0 1 7.36 18.88 L6.18 20.62 A10.40 10.40 0 0 1 3.38 17.82 L5.12 16.64 A8.30 8.30 0 0 1 3.85 13.58 L1.79 13.98 A10.40 10.40 0 0 1 1.79 10.02 L3.85 10.42 A8.30 8.30 0 0 1 5.12 7.36 L3.38 6.18 A10.40 10.40 0 0 1 6.18 3.38 L7.36 5.12 A8.30 8.30 0 0 1 10.42 3.85 Z
    M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" />
                </svg>
              </div>
            </div>
          </div>

          <button type="button" id="btnUn">Unlock</button>
        </div>

        <div class="right">
          <img
            id="image"
            src="/public/image/ChatGPT Image Aug 1, 2026, 05_29_57 PM.png"
            alt="" />

          <div class="container--span">
            <div class="span">
              <span class="spanG"></span>
            </div>
            <div class="span">
              <span class="spanG"></span>
            </div>
            <div class="span">
              <span class="spanG"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="inside">
        <!-- محتوای داخل گاوصندوق -->
        <img src="/public/image/safeBoxImg.jpg" alt="" />
      </div>
    </div>

    <audio id="doorSound" src="/public/audio/door-open-sound.mp3"></audio>

    <script>
      const door = document.querySelector(".door");
      const safe = document.querySelector(".safe");
      const safeImg = document.getElementById("image");
      const intValue = document.getElementById("password");
      const btnUnlock = document.getElementById("btnUn");
      const svgs = document.querySelectorAll(".svg");
      const spansOpenDoor = document.querySelectorAll(".spanG");

      function openSafeDoor() {
        setTimeout(() => {
          spansOpenDoor.forEach((e, i) => {
            e.classList.remove("oneG", "twoG", "threeG");
            void e.offsetWidth;

            if (i === 0) {
              e.classList.add("oneG");
            }
            if (i === 1) {
              e.classList.add("twoG");
            }

            if (i === 2) {
              e.classList.add("threeG");
            }
          });
        }, 0);
      }

      btnUnlock.addEventListener("click", update);

      intValue.addEventListener("input", rotateGears);

      const doorSound = document.getElementById("doorSound");

      function openDoor() {
        door.classList.remove("opendoor");
        void door.offsetWidth;
        door.classList.add("opendoor");

        doorSound.currentTime = 0;
        doorSound.play();

        // door.classList.add("opendoor");
      }

      function rotateGears() {
        svgs.forEach((e, i) => {
          const gear = e.querySelector("svg");

          gear.classList.remove("rotate1", "rotate2");

          setTimeout(() => {
            gear.classList.add(i === 1 ? "rotate2" : "rotate1");
          }, 0);
        });
      }

      function update() {
        if (!intValue) return;

        if (intValue.value === "1234") {
          openDoor();
          openSafeDoor();
          safeImg.classList.remove("animaImg");
          safe.classList.remove("move");

          void safeImg.offsetWidth;
          void safe.offsetWidth;

          safeImg.classList.add("animaImg");
          safe.classList.add("move");
        } else {
          intValue.value = "";
          intValue.classList.remove("opp");

          void intValue.offsetWidth;
          intValue.classList.add("opp");
          intValue.focus();
        }
      }

      intValue.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          update();
        }
      });
    </script>
  </body>
</html>
